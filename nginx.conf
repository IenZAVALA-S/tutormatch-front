# nginx del front: sirve el build y reenvía /graphql y /archivos al BFF
# (Service `bff`, puerto 3000). Así el navegador ve un solo dominio y el BFF
# no necesita CORS. No hay ingress delante.
#
# Ojo: nginx resuelve `bff` al arrancar. Si el nombre no existe (por ejemplo,
# con `docker run` sin el BFF), no arranca: en Docker local se usa
# `--add-host bff:host-gateway` (ver README).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Para el healthcheck del contenedor y las sondas de Kubernetes.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- BFF ----
    # nginx corta por defecto en 1 MB: los archivos llegan hasta 10 MB
    # (el BFF valida el límite exacto y responde 413 si se pasa).
    client_max_body_size 11m;

    location ^~ /graphql {
        proxy_pass http://bff:3000;
        include /etc/nginx/conf.d/proxy-bff.inc;
    }

    location ^~ /archivos {
        proxy_pass http://bff:3000;
        include /etc/nginx/conf.d/proxy-bff.inc;
    }

    # ---- Front ----
    # Archivos con hash en el nombre: se pueden guardar en caché un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación de una sola página: toda ruta que no sea un archivo
    # (por ejemplo, recargar /alumno/tutorias) devuelve index.html y el
    # router de React decide qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
