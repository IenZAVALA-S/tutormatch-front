# nginx del front. Solo sirve archivos estáticos: /graphql y /archivos los
# manda el ingress al BFF, en el mismo dominio (ver CLAUDE.md).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Para el healthcheck del contenedor y las sondas de Kubernetes.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Si /graphql o /archivos llegan aquí, el ingress está mal configurado:
    # mejor un 404 claro que devolver index.html.
    location ^~ /graphql { return 404; }
    location ^~ /archivos { return 404; }

    # Archivos con hash en el nombre: se pueden guardar en caché un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación de una sola página: toda ruta que no sea un archivo
    # (por ejemplo, recargar /alumno/tutorias) devuelve index.html y el
    # router de React decide qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
